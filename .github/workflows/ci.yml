name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  daemon-and-core:
    name: Headless Daemon & Core Crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build headless daemon
        run: cargo build -p hasilanx-daemon
      - name: Test core & daemon crates
        run: |
          cargo test -p hasilanx-protocol -p hasilanx-store -p hasilanx-git -p hasilanx-pty -p hasilanx-adapters --lib
          cargo test -p hasilanx-daemon

  desktop-linux:
    name: Desktop GPUI (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxcb1-dev \
            libxcb-xkb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libvulkan-dev \
            libfontconfig1-dev \
            libasound2-dev \
            libssl-dev
      - name: Build full workspace
        run: cargo build --workspace
      - name: Run workspace unit tests
        run: cargo test --workspace --lib --bins
