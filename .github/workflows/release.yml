name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            install_linux_deps: true
          - os: macos-14
            target: aarch64-apple-darwin
            install_linux_deps: false

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux GUI system libraries
        if: matrix.install_linux_deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxcb1-dev \
            libxcb-xkb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libvulkan-dev \
            libfontconfig1-dev \
            libasound2-dev \
            libssl-dev

      - name: Build release binaries
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Package archives
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          fi
          mkdir -p dist/full dist/daemon

          cp "target/${{ matrix.target }}/release/hasilanx" dist/full/
          cp "target/${{ matrix.target }}/release/hasilanx-daemon" dist/full/
          cp README.md LICENSE dist/full/
          tar -C dist/full -czf "dist/hasilanx-${TAG}-${{ matrix.target }}.tar.gz" .

          cp "target/${{ matrix.target }}/release/hasilanx-daemon" dist/daemon/
          cp LICENSE dist/daemon/
          tar -C dist/daemon -czf "dist/hasilanx-daemon-${TAG}-${{ matrix.target }}.tar.gz" .

          cd dist
          shasum -a 256 hasilanx-*.tar.gz > "SHA256SUMS-${{ matrix.target }}.txt"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/hasilanx-*.tar.gz
            dist/SHA256SUMS-*.txt
